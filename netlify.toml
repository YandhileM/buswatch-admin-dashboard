# Netlify: build the dashboard and serve the build folder
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# keep the dashboard out of search engines, plus basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
